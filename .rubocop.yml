# The style and lint rules the Format and Lint workflows enforce.
plugins:
  - rubocop-performance

AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "infra/**/*" # synced from the identity service
    - "spec/**/*"
    - "vendor/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 180

# Size limits: the client is one class on purpose, mirroring the other SDKs.
Metrics:
  Enabled: false
