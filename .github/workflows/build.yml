name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "4.0"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: false

      - name: Build the gem
        run: gem build murkio.gemspec --strict --output "$RUNNER_TEMP/murkio.gem"

      - name: Require the gem from what was packaged
        run: |
          gem unpack "$RUNNER_TEMP/murkio.gem" --target "$RUNNER_TEMP/unpacked"
          cd "$RUNNER_TEMP"
          ruby -w -I "$(echo "$RUNNER_TEMP"/unpacked/*/lib)" -e 'require "murkio"; puts Murkio::VERSION'
